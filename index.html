<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games</title>
    <meta name="description" content="A clean, basic website for playing unblocked games via iframes.">
    <!-- Tailwind CSS CDN for instant deployment -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom animations to replace framer-motion */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scale-in {
            animation: scaleIn 0.4s ease-out forwards;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 font-sans">
    <!-- Header -->
    <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-neutral-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showCatalog()">
                <div class="bg-neutral-900 p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Unblocked Games</h1>
            </div>
            
            <nav class="hidden md:flex items-center gap-4 text-sm font-medium text-neutral-500">
                <button class="hover:text-neutral-900 transition-colors">Games</button>
                <button class="hover:text-neutral-900 transition-colors">Categories</button>
                <button class="hover:text-neutral-900 transition-colors">About</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8" id="main-content">
        <!-- Catalog View (Default) -->
        <div id="catalog-view" class="fade-in">
            <div class="mb-10 text-center">
                <h2 class="text-3xl font-extrabold mb-3">Popular Games</h2>
                <p class="text-neutral-500 max-w-xl mx-auto">
                    Hand-picked selection of classic and modern games to play directly in your browser.
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="games-grid">
                <!-- Games will be injected here -->
            </div>
        </div>

        <!-- Player View (Hidden by default) -->
        <div id="player-view" class="hidden scale-in flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <button onclick="showCatalog()" class="flex items-center gap-2 text-neutral-500 hover:text-neutral-900 transition-colors font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    Back to Catalog
                </button>
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold" id="playing-title">Game Title</h2>
                    <button class="p-2 text-neutral-400 hover:text-neutral-900 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                    </button>
                </div>
            </div>

            <div id="game-container" class="relative aspect-video w-full bg-black rounded-3xl overflow-hidden shadow-2xl shadow-neutral-300/50">
                <!-- Iframe will be injected here -->
            </div>

            <div class="bg-white p-8 rounded-3xl border border-neutral-200">
                <h3 class="text-2xl font-bold mb-4" id="about-title">About Game</h3>
                <p class="text-neutral-600 leading-relaxed max-w-3xl" id="game-description">
                    Game description goes here.
                </p>
                <div class="mt-8 pt-8 border-t border-neutral-100 flex flex-wrap gap-2">
                    <span class="px-3 py-1 bg-neutral-100 rounded-full text-xs font-semibold text-neutral-500">Classic</span>
                    <span class="px-3 py-1 bg-neutral-100 rounded-full text-xs font-semibold text-neutral-500">Puzzle</span>
                    <span class="px-3 py-1 bg-neutral-100 rounded-full text-xs font-semibold text-neutral-500">Action</span>
                    <span class="px-3 py-1 bg-neutral-100 rounded-full text-xs font-semibold text-neutral-500">Fun</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-200 py-12 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-neutral-400 text-sm">
                &copy; 2026 Unblocked Games. Built with elegance and performance.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
